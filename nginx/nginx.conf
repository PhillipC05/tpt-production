upstream api      { server api:8787;   }
upstream web_app  { server web:3000;   }
upstream admin_app { server admin:3001; }

# Shared proxy headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Public site + API ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    client_max_body_size 110m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API — strip the /api prefix before forwarding
    location /api/ {
        proxy_pass         http://api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js immutable static assets — cache aggressively
    location /_next/static/ {
        proxy_pass http://web_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebSocket upgrade (live tracking via Socket.IO)
    location /socket.io/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # Everything else — consumer web frontend
    location / {
        proxy_pass         http://web_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Admin dashboard ───────────────────────────────────────────────────────────
server {
    listen 3001;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
